[project]
name = "internlink-matching-engine"
version = "0.1.0"
description = "InternLink Uganda matching engine (WBS 4.6)"
requires-python = ">=3.11"
dependencies = [
    "bcrypt>=4.2",
    "PyMySQL>=1.1",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "PyJWT>=2.8",
]

[tool.setuptools.packages.find]
include = ["employer_module*", "matching_engine*", "student_module*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
